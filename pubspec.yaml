name: grocery
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  curved_navigation_bar: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_riverpod: ^2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/1.jpg
    - assets/images/2.jpg
    - assets/images/3.jpg
    - assets/images/4.jpg
    - assets/images/5.jpg
    - assets/categories/
    - assets/onborading images/
    - assets/fruits_images/
    - assets/vegetables_images/
